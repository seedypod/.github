<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="floor" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#6f7dff"/>
      <stop offset="0.35" stop-color="#3a46c9"/>
      <stop offset="0.7" stop-color="#121640"/>
      <stop offset="1" stop-color="#020208"/>
    </radialGradient>
    <!-- grow-light crescent: lit lower rim, orange core fading to blue -->
    <radialGradient id="sunRim" cx="50%" cy="100%" r="62%" fx="52%" fy="104%">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset="0.18" stop-color="#ff7a45"/>
      <stop offset="0.42" stop-color="#b15bd6"/>
      <stop offset="0.7" stop-color="#4a58f0"/>
      <stop offset="1" stop-color="#0b0d2a"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0.55" stop-color="#ff7a45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="potSide" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2a33a8"/>
      <stop offset="0.38" stop-color="#9aa6ff"/>
      <stop offset="0.62" stop-color="#c9ccff"/>
      <stop offset="0.86" stop-color="#e0a3c4"/>
      <stop offset="1" stop-color="#ff9a6a"/>
    </linearGradient>
    <linearGradient id="potTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1a1f6b"/>
      <stop offset="1" stop-color="#0b0e33"/>
    </linearGradient>
    <linearGradient id="leafL" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5664f2"/>
      <stop offset="0.55" stop-color="#b8bfff"/>
      <stop offset="1" stop-color="#ffb48a"/>
    </linearGradient>
    <linearGradient id="leafR" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4b58e6"/>
      <stop offset="0.5" stop-color="#a9b2ff"/>
      <stop offset="1" stop-color="#ff8f5a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" x2="1">
      <stop offset="0" stop-color="#7d88ff"/>
      <stop offset="1" stop-color="#ffc39e"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#05061a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#05061a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="2.6" intercept="-0.8"/><feFuncG type="linear" slope="2.6" intercept="-0.8"/><feFuncB type="linear" slope="2.6" intercept="-0.8"/><feFuncA type="table" tableValues="1 1"/></feComponentTransfer>
    </filter>
  </defs>
  <g>
    <rect width="1024" height="1024" fill="url(#floor)"/>
    <!-- grow light / sun: sphere hanging off the top edge, lit from below -->
    <ellipse cx="560" cy="420" rx="300" ry="90" fill="url(#sunGlow)" filter="url(#blur30)"/>
    <circle cx="560" cy="50" r="350" fill="url(#sunRim)"/>
    <circle cx="545" cy="-22" r="350" fill="#03030c" filter="url(#soft)"/>
    <!-- contact shadow -->
    <ellipse cx="512" cy="905" rx="230" ry="46" fill="url(#shadow)"/>
    <!-- pod -->
    <path d="M352 690 L382 880 Q512 930 642 880 L672 690 Z" fill="url(#potSide)"/>
    <ellipse cx="512" cy="690" rx="160" ry="40" fill="#d6d9ff"/>
    <ellipse cx="512" cy="693" rx="140" ry="31" fill="url(#potTop)"/>
    <!-- sprout -->
    <path d="M510 690 C 506 640, 500 600, 512 545" fill="none" stroke="url(#stem)" stroke-width="14" stroke-linecap="round"/>
    <path d="M510 560 C 470 470, 380 450, 318 476 C 350 560, 440 590, 510 560 Z" fill="url(#leafL)"/>
    <path d="M512 552 C 552 452, 650 410, 724 432 C 700 532, 600 580, 512 552 Z" fill="url(#leafR)"/>
    <path d="M510 560 C 450 525, 395 495, 340 482" fill="none" stroke="#3a47c8" stroke-opacity="0.45" stroke-width="4"/>
    <path d="M512 552 C 575 505, 640 460, 700 438" fill="none" stroke="#3a47c8" stroke-opacity="0.4" stroke-width="4"/>
  </g>
  <rect width="1024" height="1024" filter="url(#grain)" style="mix-blend-mode:overlay" opacity="0.55"/>
</svg>
